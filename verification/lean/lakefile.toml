name = "tqlmate_verify"
version = "0.1.0"
defaultTargets = ["TqlmateExtract"]

# Spec/Properties only — self-contained Lean 4 (no Mathlib / Aeneas package).
# `lake build` does NOT import `aeneas-generated/Funs.lean` (offline extract artefact;
# regenerate with `verification/scripts/extract-aeneas.sh`). See verification/README.md.

[[lean_lib]]
name = "TqlmateExtract"
globs = ["TqlmateExtract", "TqlmateExtract.Spec", "TqlmateExtract.Properties"]
